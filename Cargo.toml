[package]
name = "t-minus"
version = "0.1.0"
edition = "2021"
description = "T-minus event coordination for multi-agent systems"
license = "MIT"

[[bin]]
name = "t-minus"
path = "src/main.rs"

[lib]
name = "t_minus"
path = "src/lib.rs"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
thiserror = "1"
colored = "2"

[dev-dependencies]
tempfile = "3"
